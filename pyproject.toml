[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-soundboard"
version = "0.4.4"
description = "TuxCue — a local Linux soundboard with a browser interface and virtual microphone"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "qrcode>=8.2,<9"]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.setuptools]
packages = ["soundboard"]
